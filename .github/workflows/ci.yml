name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify generated files are committed
        run: test -z "$(git status --porcelain)"
      - name: Verify Agent Skills discovery
        run: npm exec --no -- skills add . --list
      - name: Clean-install shader design engineering
        shell: bash
        run: |
          install_root="$(mktemp -d)"
          cd "$install_root"
          "$GITHUB_WORKSPACE/node_modules/.bin/skills" add "$GITHUB_WORKSPACE" --skill shader-design-engineering --agent codex --yes
          test -f .agents/skills/shader-design-engineering/SKILL.md
          test -f .agents/skills/shader-design-engineering/references/webgl2-glsl.md
          test "$(find .agents/skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "1"
      - name: Clean-install creative rendering audit
        shell: bash
        run: |
          install_root="$(mktemp -d)"
          cd "$install_root"
          "$GITHUB_WORKSPACE/node_modules/.bin/skills" add "$GITHUB_WORKSPACE" --skill creative-rendering-audit --agent codex --yes
          test -f .agents/skills/creative-rendering-audit/SKILL.md
          test -f .agents/skills/creative-rendering-audit/references/audit-rubric.md
          test "$(find .agents/skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "1"
